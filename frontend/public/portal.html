<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FinGuard AI — Prompt Injection Defense Framework</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --void: #6A8EAF;
    --surface: #FFFFFF;
    --surface-raised: #F4F7FB;
    --border: rgba(0, 0, 0, 0.08);
    --border-strong: rgba(0, 0, 0, 0.15);
    --border-card: rgba(0, 0, 0, 0.06);
    --muted: rgba(255, 255, 255, 0.8);
    --muted-dark: #475569;
    --text: #FFFFFF;
    --text-dark: #0F172A;
    --accent: #1D4ED8;
    --accent-glow: rgba(29, 78, 216, 0.3);
    --accent-dim: #DBEAFE;
    --safe: #22C55E;
    --warn: #EAB308;
    --threat: #EF4444;
  }
  *{box-sizing:border-box;}
  html,  body{margin:0;padding:0;background:linear-gradient(135deg, #98B5CF 0%, #6A8EAF 100%);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;}
  #bg-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  }
  .bg-base {
    position: absolute; inset: 0;
    background: none;
  }
  .bg-ambient-lights { position: absolute; inset: 0; }
  .bg-ambient-lights .light {
    position: absolute; border-radius: 50%; filter: blur(80px);
    background: rgba(255,255,255,0.15);
    animation: ambientBreathe 10s infinite alternate ease-in-out;
  }
  .bg-ambient-lights .light-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; animation-delay: 0s; }
  .bg-ambient-lights .light-2 { top: -20%; right: 20%; width: 40vw; height: 40vw; animation-delay: -3s; }
  .bg-ambient-lights .light-3 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; animation-delay: -7s; }
  .bg-ambient-lights .light-hero { top: 20%; left: 30%; width: 800px; height: 800px; background: rgba(255,255,255,0.2); animation-duration: 12s; }
  @keyframes ambientBreathe {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.1); opacity: 1; }
  }
  
  .bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 1) 1px, transparent 1px);
    background-size: 64px 64px;
    background-position: center center;
    opacity: 0.1;
  }
  .bg-grid-interactive {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 1) 1px, transparent 1px);
    background-size: 64px 64px;
    background-position: center center;
    -webkit-mask-image: radial-gradient(ellipse var(--mask-width, 150px) var(--mask-height, 150px) at var(--mouse-x, 50vw) var(--mouse-y, 50vh), black 0%, transparent 100%);
    mask-image: radial-gradient(ellipse var(--mask-width, 150px) var(--mask-height, 150px) at var(--mouse-x, 50vw) var(--mouse-y, 50vh), black 0%, transparent 100%);
    filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8)) drop-shadow(0 0 3px rgba(255, 255, 255, 1));
  }
  
  .bg-cursor-light {
    position: absolute; inset: 0;
    background: radial-gradient(circle 600px at var(--mouse-x, 50vw) var(--mouse-y, 50vh), rgba(255,255,255,0.2) 0%, transparent 100%);
  }
  
  #bg-particles { position: absolute; inset: 0; }
  
  .bg-vignette {
    position: absolute; inset: 0;
    box-shadow: inset 0 0 150px 50px rgba(106, 142, 175, 0.5);
  }
  
  @media (prefers-reduced-motion: reduce) {
    .bg-ambient-lights .light { animation: none !important; }
    .bg-cursor-light { transition: none; }
    .bg-cursor-light { background: radial-gradient(circle 600px at 50% 50%, rgba(255,255,255,0.1) 0%, transparent 100%); }
  }
  .disp{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:8px;}
  a,button{font-family:inherit;}
  button{cursor:pointer;border:none;background:none;color:inherit;}

  ::placeholder {
    color: var(--muted);
    opacity: 1;
  }

  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pop{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
  @keyframes dash{to{background-position:-24px 0;}}
  @keyframes pulseSoft{0%,100%{opacity:.6;}50%{opacity:1;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pingRing{0%{transform:scale(1);opacity:.5;}75%,100%{transform:scale(1.7);opacity:0;}}
  .rise{animation:rise .3s ease-out;}
  .pop{animation:pop .25s ease-out;}
  .pulse{animation:pulseSoft 2s ease-in-out infinite;}
  .spin{animation:spin 1s linear infinite;}

  /* layout */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    position:fixed;inset:0 auto 0 0;width:240px;display:flex;flex-direction:column;
    border-right:1px solid var(--border-card);background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);
    z-index:30; overflow-y:auto; overflow-x:hidden; box-shadow: 0 0 20px rgba(0,0,0,0.05);
    color:var(--text-dark); --text: var(--text-dark); --muted: var(--muted-dark);
  }
  @media (max-width:820px){ .sidebar{display:none;} .main{padding-left:0 !important;padding-top:56px;} .mobilenav{display:flex !important;} }
  .mobilenav{display:none;position:fixed;top:0;left:0;right:0;z-index:30;gap:4px;overflow-x:auto;
    border-bottom:1px solid var(--border);background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);padding:8px;}
  .mobilenav button{flex-shrink:0;display:flex;align-items:center;gap:6px;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:500;color:var(--muted);}
  .mobilenav button.active{background:rgba(29, 78, 216, 0.15);color:var(--accent);}

  .sb-logo{display:flex;align-items:center;gap:10px;padding:22px 20px;}
  .sb-logo .icn{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-dim));
    display:flex;align-items:center;justify-content:center;color:#FFFFFF;box-shadow:0 0 16px rgba(29, 78, 216, 0.5);}
  .sb-logo .t1{font-size:14px;font-weight:600;line-height:1.1;color:var(--text-dark);}
  .sb-logo .t2{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}

  .sb-nav{flex:1;padding:0 12px;display:flex;flex-direction:column;gap:8px;}
  .sb-nav button{display:flex;align-items:center;gap:14px;border-radius:8px;padding:12px 14px;font-size:14px;font-weight:500;color:var(--muted);transition:all .15s;text-align:left;width:100%;border-left:2px solid transparent;}
  .sb-nav button:hover{background:rgba(0,0,0,0.04);color:var(--text-dark);}
  .sb-nav button.active{background:rgba(29, 78, 216, 0.1);color:var(--text-dark);border-left:2px solid var(--accent);font-weight:600;}
  .sb-nav button.active .icon{color:var(--accent);}

  .sb-status{margin:0 12px 20px;border-radius:12px;border:1px solid rgba(180,142,67,0.2);background:rgba(241,233,218,0.03);padding:14px;position:relative;}
  .sb-status::before{content:"";position:absolute;top:0;left:12px;right:12px;height:1px;background:linear-gradient(90deg,transparent,rgba(180,142,67,0.3),transparent);}
  .sb-status .row{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;}
  .dot{width:6px;height:6px;border-radius:99px;flex-shrink:0;}

  .main{min-height:100vh;width:100%;padding-left:240px;}
  .wrap{max-width:1440px;margin:0 auto;padding:40px 48px;}
  @media (max-width:820px){.wrap{padding:24px;}}
  @media (max-width:640px){.wrap{padding:16px;}}

  .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.15em;font-weight:bold !important;color:#FFFFFF !important;}
  .h1{margin:4px 0 0;font-size:28px;font-weight:bold !important;color:#FFFFFF !important;}
  .pdesc{margin:8px 0 0;max-width:640px;font-size:14px;font-weight:bold !important;color:#FFFFFF !important;}
  .pagehead{margin-bottom:28px;}

  .card{border-radius:18px;border:1px solid var(--border-card);background:var(--surface);backdrop-filter:blur(16px);padding:24px;
    color:var(--text-dark);box-shadow:0 12px 32px rgba(0,0,0,0.2);
    --text: var(--text-dark); --muted: var(--muted-dark); --border: var(--border-card);
    transition:border-color .2s, box-shadow .2s, transform .12s ease-out; transform-style:preserve-3d;}
  .card:hover{border-color:rgba(46,26,17,0.2);box-shadow:0 16px 48px rgba(20,10,5,0.18);}
  .cardhead{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .cardtitle{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-dark);}

  .grid{display:grid;gap:24px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:99px;border:1px solid;padding:4px 10px;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
  .badge-safe{background:rgba(34,197,94,0.15);color:var(--safe);border-color:rgba(34,197,94,0.3);}
  .badge-warning{background:rgba(234,179,8,0.15);color:var(--warn);border-color:rgba(234,179,8,0.3);}
  .badge-threat{background:rgba(239,68,68,0.15);color:var(--threat);border-color:rgba(239,68,68,0.3);}
  .badge-neutral{background:rgba(255,255,255,0.05);color:var(--muted);border-color:rgba(255,255,255,0.1);}
  .badge-accent{background:rgba(76,141,255,0.15);color:var(--accent-glow);border-color:rgba(76,141,255,0.3);}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;font-weight:500;font-size:14px;height:40px;padding:0 16px;transition:transform .1s, background .15s, opacity .15s;}
  .btn:active{transform:scale(.98);}
  .btn[disabled]{opacity:.4;pointer-events:none;}
  .btn-default{background:var(--accent);color:#FFFFFF;box-shadow:0 0 0 1px var(--accent-glow);}
  .btn-default:hover{background:var(--accent-glow);color:#FFFFFF;}
  .btn-outline{background:var(--surface);border:1px solid var(--border-card);color:var(--text-dark);}
  .btn-outline:hover{background:var(--surface-raised);}
  .btn-danger{background:var(--threat);color:#fff;}
  .btn-danger:hover{opacity:.9;}
  .btn-sm{height:32px;padding:0 12px;font-size:12px;}

  .icon{width:16px;height:16px;flex-shrink:0;}
  .icon-sm{width:14px;height:14px;}
  .icon-lg{width:20px;height:20px;}

  /* gauge */
  .gauge-wrap{display:flex;align-items:center;gap:16px;}
  .gauge-label-lg{font-size:18px;font-weight:500;font-family:'Space Grotesk',sans-serif;}
  .gauge-sub{font-size:12px;color:var(--muted);}

  /* activity / list rows */
  .row-btn{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:10px 6px;border-radius:8px;text-align:left;transition:background .15s;border-bottom:1px solid rgba(255,255,255,0.06);}
  .row-btn:hover{background:rgba(255,255,255,0.02);}
  .row-item:last-child .row-btn{border-bottom:none;}
  .avatar{display:flex;height:28px;width:28px;align-items:center;justify-content:center;border-radius:99px;flex-shrink:0;background:rgba(255,255,255,0.06);color:var(--text);}
  .avatar-threat{background:rgba(239,68,68,0.15);color:var(--threat);}
  .chev{transition:transform .2s;color:var(--muted);}
  .chev.open{transform:rotate(180deg);}
  .detailbox{margin:0 0 10px 40px;border-radius:8px;border:1px solid var(--border-card);background:rgba(46,26,17,0.04);padding:8px 12px;font-size:11px;color:var(--muted-dark);}

  /* quick actions */
  .qa-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .qa{display:flex;align-items:center;gap:8px;border-radius:12px;border:1px solid var(--border-card);background:var(--surface);padding:9px 14px;font-size:12px;font-weight:500;color:var(--muted-dark);transition:all .15s;box-shadow:0 4px 12px rgba(20,10,5,0.06);}
  .qa:hover{border-color:var(--accent);background:var(--surface-raised);color:var(--text-dark);}
  .qa:hover .icon{color:var(--accent-glow);}

  /* sparkline / chart svg */
  .spark{width:100%;height:40px;display:block;}
  .chart-box{width:100%;}

  /* pipeline */
  .pipeline{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;}
  .pipeline-node{flex:1;min-width:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--border-card);background:var(--surface);padding:14px 10px;text-align:center;color:var(--muted-dark);transition:all .3s;}
  .pipeline-node span{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-family:'JetBrains Mono',monospace;}
  .pipeline-node.active{border-color:var(--accent);color:var(--accent);background:rgba(180,142,67,0.1);box-shadow:0 0 18px rgba(180,142,67,0.25);animation:pulseSoft 1.2s ease-in-out infinite;}
  .pipeline-node.done{border-color:var(--safe);color:var(--safe);background:rgba(61,220,132,0.1);}
  .pipeline-node.threat{border-color:var(--threat);color:var(--threat);background:rgba(165,35,35,0.1);box-shadow:0 0 18px rgba(165,35,35,0.25);}
  .pipeline-conn{position:relative;flex:0 0 24px;height:1px;align-self:center;background:rgba(46,26,17,0.1);min-width:16px;}
  .pipeline-conn.active{background-image:repeating-linear-gradient(90deg,#B48E43 0 6px,transparent 6px 12px);background-size:16px 1px;animation:dash 1s linear infinite;}

  /* attack cards */
  .attack-icn{display:flex;height:36px;width:36px;align-items:center;justify-content:center;border-radius:10px;background:rgba(76,141,255,0.1);color:var(--accent-glow);}

  /* inspector */
  .switch{position:relative;height:24px;width:44px;border-radius:99px;background:rgba(255,255,255,0.1);transition:background .2s;flex-shrink:0;}
  .switch.on{background:var(--accent);}
  .switch .thumb{position:absolute;top:2px;left:2px;height:20px;width:20px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s;}
  .switch.on .thumb{transform:translateX(20px);}

  /* modal */
  .overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{width:100%;max-width:420px;border-radius:20px;border:1px solid var(--border-card);background:var(--surface);color:var(--text-dark);padding:24px;box-shadow:0 24px 60px rgba(20,10,5,0.3);}
  .modal-row{display:flex;align-items:center;justify-content:between;justify-content:space-between;padding:4px 0;}

  /* toast */
  .toaststack{position:fixed;bottom:96px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px;pointer-events:none;}
  .toast{pointer-events:auto;border-radius:12px;border:1px solid var(--border-card);background:var(--surface);padding:14px;box-shadow:0 12px 32px rgba(20,10,5,0.2);display:flex;gap:10px;align-items:flex-start;}
  .toast-safe{border-color:var(--safe);color:var(--safe);}
  .toast-threat{border-color:var(--threat);color:var(--threat);}
  .toast-warning{border-color:var(--warn);color:var(--warn);}
  .toast p.title{margin:0;font-size:13px;font-weight:500;color:var(--text-dark);}
  .toast p.desc{margin:2px 0 0;font-size:11px;color:var(--muted-dark);}

  /* floating chat */
  .fab{position:fixed;bottom:24px;right:24px;z-index:70;height:56px;width:56px;border-radius:99px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-dim));box-shadow:0 4px 24px rgba(76,141,255,0.5);transition:transform .15s;}
  .fab:hover{transform:scale(1.06);}
  .fab .ring{position:absolute;inset:0;border-radius:99px;background:rgba(76,141,255,0.35);animation:pingRing 2.4s cubic-bezier(0,0,.2,1) infinite;}
  .fab svg{position:relative;z-index:1;}
  .chatpanel{position:fixed;bottom:92px;right:24px;z-index:70;width:360px;max-width:92vw;height:520px;border-radius:20px;border:1px solid var(--border-card);background:var(--surface);color:var(--text-dark);box-shadow:0 24px 60px rgba(20,10,5,0.3);display:flex;flex-direction:column;overflow:hidden;}
  .chatpanel-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border-card);background:var(--surface-raised);}
  .chatpanel-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}

  /* chat bubbles */
  .bubble-row{display:flex;gap:10px;}
  .bubble-row.user{justify-content:flex-end;}
  .bubble{max-width:80%;border-radius:16px;padding:12px 16px;font-size:14px;}
  .bubble.user{background:var(--accent);color:#FFFFFF;}
  .bubble.agent{background:var(--surface-raised);border:1px solid var(--border-card);color:var(--text-dark);}
  .av-round{display:flex;height:32px;width:32px;flex-shrink:0;align-items:center;justify-content:center;border-radius:99px;}
  .av-user{background:rgba(46,26,17,0.1);color:var(--text-dark);}
  .av-agent{background:rgba(180,142,67,0.15);color:var(--accent);}

  .think-step{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted-dark);font-family:'JetBrains Mono',monospace;}
  .toolcall{border-radius:8px;border:1px solid var(--border-card);background:var(--surface-raised);padding:10px;}
  .toolcall .head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .toolcall .name{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-dark);font-family:'JetBrains Mono',monospace;}
  .toolcall .args{margin-top:6px;font-size:11px;color:var(--muted-dark);font-family:'JetBrains Mono',monospace;}
  .toolcall .res{margin-top:4px;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text-dark);}
  .toolcall .res.blocked{color:var(--threat);}

  /* replay */
  .timeline{position:relative;margin-left:16px;border-left:1px solid var(--border);padding-left:24px;display:flex;flex-direction:column;gap:24px;}
  .tl-item{position:relative;}
  .tl-dot{position:absolute;left:-45px;top:0;display:flex;height:28px;width:28px;align-items:center;justify-content:center;border-radius:99px;box-shadow:0 0 0 4px var(--void);}
  .tl-card{border-radius:12px;border:1px solid var(--border-card);background:var(--surface);padding:14px;}
  .session-btn{display:block;width:100%;text-align:left;border-radius:12px;border:1px solid var(--border-card);background:var(--surface);padding:14px;margin-bottom:8px;transition:all .15s;}
  .session-btn:hover{background:var(--surface-raised);}
  .session-btn.active{border-color:var(--accent);background:var(--surface-raised);}

  table.cmp{width:100%;border-collapse:collapse;text-align:left;min-width:420px;}
  table.cmp th{padding:10px 0;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-dark);border-bottom:1px solid var(--border-card);font-weight:500;}
  table.cmp td{padding:12px 0;font-size:14px;border-bottom:1px solid rgba(46,26,17,0.06);color:var(--text-dark);}
  table.cmp tr:last-child td{border-bottom:none;}

  .filter-chip{border-radius:99px;border:1px solid var(--border-card);padding:4px 10px;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-dark);font-family:'JetBrains Mono',monospace;transition:all .15s;}
  .filter-chip.active{border-color:var(--accent);background:rgba(180,142,67,0.15);color:var(--accent);}

  /* ---- fun stuff ---- */

  /* mascot */
  .mascot{width:44px;height:44px;flex-shrink:0;transition:transform .3s;}
  .mascot .eye{transform-origin:center;transform-box:fill-box;animation:blink 4.5s ease-in-out infinite;}
  .mascot.alert{animation:mascotShake .4s ease-in-out;}
  @keyframes blink{0%,92%,100%{transform:scaleY(1);}94%,96%{transform:scaleY(0.1);}}
  @keyframes mascotShake{0%,100%{transform:rotate(0);}25%{transform:rotate(-6deg);}75%{transform:rotate(6deg);}}
  .mascot-row{display:flex;align-items:center;gap:10px;padding:0 12px 14px;}
  .mascot-bubble{font-size:11px;color:var(--muted);font-style:italic;}

  /* streak badge */
  .streak-pill{display:flex;align-items:center;gap:8px;border-radius:12px;border:1px solid rgba(210,226,236,0.25);background:rgba(210,226,236,0.06);padding:10px 12px;margin:0 12px 12px;}

  .streak-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
  .streak-title{font-size:11px;color:var(--text);font-weight:500;margin-top:1px;}
  @keyframes bumpPop{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}
  .streak-bump{animation:bumpPop .4s ease-out;}

  /* card tilt */
  .card{will-change:transform;}
  .card.tiltable{transform:perspective(700px) rotateX(0deg) rotateY(0deg);transition:transform .15s ease-out, border-color .2s, box-shadow .2s;}

  /* radar sweep behind gauge */
  .radar-wrap{position:relative;}
  .radar-sweep{position:absolute;inset:-6px;border-radius:99px;overflow:hidden;pointer-events:none;}
  .radar-sweep::before{content:"";position:absolute;inset:0;border-radius:99px;
    background:conic-gradient(from 0deg, rgba(180,142,67,0) 0deg, rgba(180,142,67,0.35) 18deg, rgba(180,142,67,0) 40deg);
    animation:radarspin 3.2s linear infinite;}
  @keyframes radarspin{to{transform:rotate(360deg);}}

  /* confetti */
  .confetti-piece{position:fixed;top:0;left:0;width:8px;height:8px;pointer-events:none;z-index:200;border-radius:2px;}
  @keyframes confettiFall{
    0%{transform:translate(var(--x0),var(--y0)) rotate(0deg);opacity:1;}
    100%{transform:translate(var(--x1),var(--y1)) rotate(var(--rot));opacity:0;}
  }

  /* fun little rotated stickers */
  .sticker{display:inline-block;transform:rotate(-3deg);}
  .wobble:hover{animation:wobble .5s ease-in-out;}
  @keyframes wobble{0%,100%{transform:rotate(0);}25%{transform:rotate(-2deg);}75%{transform:rotate(2deg);}}

  /* sound toggle */
  .sound-btn{display:flex;align-items:center;gap:6px;border-radius:8px;padding:4px 8px;font-size:10px;color:var(--muted);transition:color .15s;margin-left:auto;}
  .sound-btn:hover{color:var(--text);}

  /* +1 popup */
  .plusone{position:fixed;z-index:90;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--safe);pointer-events:none;
    animation:plusOneFloat 1s ease-out forwards;}
  @keyframes plusOneFloat{0%{opacity:0;transform:translateY(0) scale(.7);}20%{opacity:1;transform:translateY(-6px) scale(1.1);}100%{opacity:0;transform:translateY(-34px) scale(1);}}

  /* ambient particles */
  .particle{position:absolute;border-radius:99px;pointer-events:none;background:rgba(180,142,67,1);
    animation:driftUp linear infinite;}
  @keyframes driftUp{
    0%{transform:translateY(0) translateX(0); opacity:0;}
    20%{opacity:var(--target-opacity, 0.4);}
    80%{opacity:var(--target-opacity, 0.4);}
    100%{transform:translateY(-120vh) translateX(var(--dx));opacity:0;}
  }

  /* party mode easter egg */
  @keyframes rainbowPulse{
    0%{box-shadow:inset 0 0 0 3px #79A3C3;}
    20%{box-shadow:inset 0 0 0 3px #D2E2EC;}

    60%{box-shadow:inset 0 0 0 3px #22C55E;}
    80%{box-shadow:inset 0 0 0 3px #EAB308;}
    100%{box-shadow:inset 0 0 0 3px transparent;}
  }
  .party-flash{position:fixed;inset:0;z-index:150;pointer-events:none;animation:rainbowPulse 1.4s ease-out forwards;}
  .sb-logo{cursor:pointer;}
  .sb-logo .icn.party{animation:mascotShake .4s ease-in-out;}

/* sparkline area chart (pure svg) */
function sparkline(data, color){
  const w=280,h=40, max=Math.max(...data), min=Math.min(...data,0);
  const range = (max-min)||1;
  const stepX = w/(data.length-1);
  const pts = data.map((v,i)=>[i*stepX, h - ((v-min)/range)*h]);
  const line = pts.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area = line+" L"+w+","+h+" L0,"+h+" Z";
  const id = "grad"+Math.random().toString(36).slice(2,8);
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="'+color+'" stop-opacity="0.5"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/>'+
    '</linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#'+id+')"/>'+
    '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="1.5"/>'+
  '</svg>';
}

/* line chart with axis labels */
function lineChart(data, key, labelKey, opts){
  opts = opts || {};
  const w=520,h=180, padL=28,padB=20,padT=10,padR=10;
  const vals = data.map(d=>d[key]);
  const min = opts.min!==undefined?opts.min:Math.min(...vals);
  const max = opts.max!==undefined?opts.max:Math.max(...vals);
  const range=(max-min)||1;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const stepX = innerW/(data.length-1);
  const pts = data.map((d,i)=>[padL+i*stepX, padT+innerH-((d[key]-min)/range)*innerH]);
  const line = pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const gridLines = [0,1,2,3].map(i=>{
    const y = padT + innerH*i/3;
    return '<line x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'" stroke="rgba(255,255,255,0.08)"/>';
  }).join("");
  const labels = data.map((d,i)=>'<text x="'+pts[i][0]+'" y="'+(h-4)+'" fill="rgba(241,233,218,0.65)" font-size="10" text-anchor="middle" font-family="JetBrains Mono, monospace">'+d[labelKey]+'</text>').join("");
  const dots = pts.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="#B48E43"/>').join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;display:block;">'+gridLines+'<path d="'+line+'" fill="none" stroke="#B48E43" stroke-width="2.2"/>'+dots+labels+'</svg>';
}

/* grouped bar chart (before/after) */
function groupedBarChart(data){
  const w=560,h=280, padL=30,padB=34,padT=10,padR=10;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const groupW = innerW/data.length;
  const barW = groupW*0.32;
  const max=100;
  const gridLines=[0,25,50,75,100].map(v=>{
    const y = padT + innerH - (v/max)*innerH;
    return '<line x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'" stroke="rgba(255,255,255,0.08)"/>'+
      '<text x="'+(padL-6)+'" y="'+(y+3)+'" fill="rgba(241,233,218,0.65)" font-size="9" text-anchor="end" font-family="JetBrains Mono, monospace">'+v+'</text>';
  }).join("");
  const bars = data.map((d,i)=>{
    const gx = padL + i*groupW;
    const hb = (d.before/max)*innerH, ha=(d.after/max)*innerH;
    const x1 = gx + groupW/2 - barW - 3;
    const x2 = gx + groupW/2 + 3;
    const y1 = padT+innerH-hb, y2=padT+innerH-ha;
    const label = '<text x="'+(gx+groupW/2)+'" y="'+(h-8)+'" fill="rgba(241,233,218,0.65)" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">'+d.name+'</text>';
    return '<rect x="'+x1+'" y="'+y1+'" width="'+barW+'" height="'+hb+'" rx="3" fill="#A52323"/>'+
           '<rect x="'+x2+'" y="'+y2+'" width="'+barW+'" height="'+ha+'" rx="3" fill="#3DDC84"/>'+label;
  }).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;display:block;">'+gridLines+bars+'</svg>'+
    '<div style="display:flex;gap:16px;margin-top:6px;font-size:11px;color:var(--muted-dark);">'+
    '<span style="display:flex;align-items:center;gap:6px;"><span style="width:9px;height:9px;border-radius:2px;background:#A52323;display:inline-block;"></span>Without Defense</span>'+
    '<span style="display:flex;align-items:center;gap:6px;"><span style="width:9px;height:9px;border-radius:2px;background:#3DDC84;display:inline-block;"></span>With Defense</span></div>';
}

/* pipeline visualization */
function pipeline(activeIndex, verdict){
  let html = '<div class="pipeline">';
  pipelineStages.forEach((stage,i)=>{
    const isVerdict = stage.id==="verdict";
    let cls="";
    if(i>activeIndex) cls="";
    else if(i===activeIndex && !verdict) cls="active";
    else if(i===pipelineStages.length-1 && verdict==="blocked") cls="threat";
    else cls="done";
    const label = (isVerdict && verdict) ? (verdict==="blocked"?"Blocked":"Allowed") : stage.label;
    const ic = isVerdict && verdict ? icon(verdict==="blocked"?"shieldOff":"shieldCheck","icon-sm") : "";
    html += '<div class="pipeline-node '+cls+'">'+ic+'<span>'+label+'</span></div>';
    if(i<pipelineStages.length-1){
      const connActive = i<activeIndex || (i===activeIndex && !!verdict);
      html += '<div class="pipeline-conn '+(connActive?"active":"")+'"></div>';
    }
  });
  html += '</div>';
  return html;
}

/* ============================== SOUND ============================== */
let audioCtx = null;
function ensureAudio(){
  if(audioCtx) { if(audioCtx.state==="suspended") audioCtx.resume(); return; }
  try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
}
function playTone(freq, duration, wave, delay){
  if(!audioCtx) return;
  delay = delay||0;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = wave||"sine";
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.16, t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+duration+0.03);
}
function chime(kind){
  if(!state.soundOn) return;
  ensureAudio();
  if(!audioCtx) return;
  if(kind==="block"){ playTone(660,0.12,"triangle",0); playTone(880,0.16,"triangle",0.08); }
  else if(kind==="reject"){ playTone(523,0.16,"sine",0); }
  else if(kind==="levelup"){ playTone(523,0.1,"square",0); playTone(659,0.1,"square",0.11); playTone(784,0.18,"square",0.22); }
  else if(kind==="party"){ [523,659,784,988,1175].forEach((f,i)=>playTone(f,0.12,"square",i*0.09)); }
}

/* ============================== ATTACK LAB ============================== */
function runAttack(id){
  const al = state.attackLab;
  if(al.runningId) return;
  al.runningId=id; al.activeIndex=0; al.verdict=null; al.confidence=null;
  al.codename = randomCodename();
  render();
  let step=0;
  attackTimer = setInterval(()=>{
    step++; al.activeIndex=step; render();
    if(step>=pipelineStages.length-1){
      clearInterval(attackTimer);
      const conf = 90+Math.floor(Math.random()*9);
      setTimeout(()=>{
        al.verdict="blocked"; al.confidence=conf; render();
        const attack = attackTypes.find(a=>a.id===id);
        chime("block");
        pushToast("threat","Attack blocked","Detection confidence "+conf+"% · traced to "+al.codename);
        al.history.unshift({ id:Date.now(), name:attack.name, icon:attack.icon, confidence:conf, codename:al.codename, time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}) });
        al.history = al.history.slice(0,8);
        render();
        bumpStreak();
        confettiBurst(document.querySelector(".pipeline-node.threat"));
        setTimeout(()=>setMascotMood("happy"), 900);
      }, 500);
    }
  }, 700);
}
function resetAttack(){
  const al = state.attackLab;
  al.runningId=null; al.activeIndex=-1; al.verdict=null; al.confidence=null; render();
}

    (state.chat.phase==="resolved" ? '<div style="border-top:1px solid var(--border);padding:12px;"><button class="btn btn-outline btn-sm" style="width:100%;" data-action="chat-start">Replay demo</button></div>' : '')+
  '</div>';
}

/* ============================== MASTER RENDER ============================== */
function render(){
  const root = document.getElementById("root");
  root.innerHTML =
    '<div class="app">'+
      renderSidebar()+
      renderMobileNav()+
      '<main class="main"><div class="wrap">'+ (pageRenderers[state.page] ? pageRenderers[state.page]() : "") +'</div></main>'+
    '</div>'+
    renderFab()+
    renderChatPanel()+
    renderModal()+
    renderToasts();
}

/* ============================== CARD TILT ============================== */
let tiltedCard = null;
document.addEventListener("mousemove", function(e){
  const card = e.target.closest ? e.target.closest(".card") : null;
  if(card){
    if(tiltedCard && tiltedCard!==card) tiltedCard.style.transform = "";
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left)/r.width;
    const py = (e.clientY - r.top)/r.height;
    const rotY = (px-0.5)*6;
    const rotX = (0.5-py)*6;
    card.style.transform = "perspective(800px) rotateX("+rotX.toFixed(2)+"deg) rotateY("+rotY.toFixed(2)+"deg) translateZ(0)";
    tiltedCard = card;
  } else if(tiltedCard){
    tiltedCard.style.transform = "";
    tiltedCard = null;
  }
});

/* ============================== EVENT DELEGATION ============================== */
document.addEventListener("click", function(e){
  ensureAudio();
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.getAttribute("data-action");
  const id = el.getAttribute("data-id");

  switch(action){
    case "nav":
      state.page = el.getAttribute("data-page");
      if(state.page==="dashboard") runCountUp(); else render();
      break;
    case "fab-toggle":
      state.fabOpen = !state.fabOpen; render();
      break;
    case "chat-start":
      startChatDemo();
      break;
    case "chat-approve":
      chatApprove();
      break;
    case "chat-reject":
      chatReject();
      break;
    case "dash-toggle":
      state.dashboard.expanded = state.dashboard.expanded===id ? null : id; render();
      break;
    case "security-filter":
      state.security.filter = el.getAttribute("data-filter"); render();
      break;
    case "security-toggle-module":
      { const m = securityModules.find(x=>x.id===id);
        const next = !state.security.modules[id];
        state.security.modules[id] = next;
        pushToast(next?"safe":"warning", m.name+" "+(next?"enabled":"disabled"), next?"Module resumed monitoring.":"Coverage gap — re-enable when done testing.");
      }
      break;
    case "alert-toggle":
      state.security.expanded = state.security.expanded===id ? null : id; render();
      break;
    case "attack-run":
      runAttack(id);
      break;
    case "attack-reset":
      resetAttack();
      break;
    case "inspector-toggle":
      state.inspector.revealed = !state.inspector.revealed; render();
      break;
    case "replay-select":
      state.replay.activeId = id; render();
      break;
    case "sound-toggle":
      state.soundOn = !state.soundOn; render();
      break;
    case "logo-click":
      { const now = Date.now();
        state.logoClicks.count = (now - state.logoClicks.last < 1500) ? state.logoClicks.count+1 : 1;
        state.logoClicks.last = now;
        if(state.logoClicks.count>=5){
          state.logoClicks.count = 0;
          partyMode();
        }
      }
      break;
    case "modal-noop":
      break;
    default:
      break;
  }
});

/* ============================== PARTY MODE EASTER EGG ============================== */
function partyMode(){
  chime("party");
  const flash = document.createElement("div");
  flash.className = "party-flash";
  document.body.appendChild(flash);
  setTimeout(()=>flash.remove(), 1500);
  confettiBurst(document.querySelector(".sb-logo .icn"));
  setTimeout(()=>confettiBurst(document.querySelector(".fab")), 150);
  pushToast("safe","🛡️ You found the secret!","Five clicks and true dedication. Respect.");
}

/* ============================== INTERACTIVE BACKGROUND ============================== */
let mx = window.innerWidth / 2, my = window.innerHeight / 2;
let targetMx = mx, targetMy = my;
let lastMx = mx, lastMy = my;

window.addEventListener('mousemove', e => {
  targetMx = e.clientX;
  targetMy = e.clientY;
});
function updateBgGlow() {
  mx += (targetMx - mx) * 0.12;
  my += (targetMy - my) * 0.12;
  
  let vx = Math.abs(mx - lastMx);
  let vy = Math.abs(my - lastMy);
  lastMx = mx;
  lastMy = my;
  
  // Calculate dynamic dimensions based on velocity to stretch the mask
  let baseSize = 120;
  let stretchX = baseSize + (vx * 18);
  let stretchY = baseSize + (vy * 18);
  
  // Cap the stretch to prevent it from covering the whole screen unnecessarily
  if (stretchX > 1000) stretchX = 1000;
  if (stretchY > 1000) stretchY = 1000;

  document.documentElement.style.setProperty('--mouse-x', mx + 'px');
  document.documentElement.style.setProperty('--mouse-y', my + 'px');
  document.documentElement.style.setProperty('--mask-width', stretchX + 'px');
  document.documentElement.style.setProperty('--mask-height', stretchY + 'px');
  
  requestAnimationFrame(updateBgGlow);
}
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  requestAnimationFrame(updateBgGlow);
}

/* ============================== INIT ============================== */
render();
runCountUp();
spawnParticles();
setInterval(function(){
  if(state.mascot.mood==="idle"){
    state.mascot.quipIndex = (state.mascot.quipIndex+1) % idleQuips.length;
    render();
  }
}, 9000);
</script>
