<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinGuard AI</title>
    <script type="module" crossorigin src="/assets/index-CFBME-S_.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CC770JPE.css">
  </head>
  <body>
    <div id="bg-container">
      <div class="bg-base"></div>
      <div class="bg-ambient-lights">
        <div class="light light-1"></div>
        <div class="light light-2"></div>
        <div class="light light-3"></div>
        <div class="light light-hero"></div>
      </div>
      <div class="bg-grid"></div>
      <div class="bg-grid-interactive"></div>
      <div class="bg-cursor-light"></div>
      <div id="bg-particles"></div>
      <div class="bg-vignette"></div>
    </div>
    
    <div id="root"></div>

    <script>
      let mx = window.innerWidth / 2, my = window.innerHeight / 2;
      let targetMx = mx, targetMy = my;
      let lastMx = mx, lastMy = my;

      window.addEventListener('mousemove', e => {
        targetMx = e.clientX;
        targetMy = e.clientY;
      });
      function updateBgGlow() {
        mx += (targetMx - mx) * 0.12;
        my += (targetMy - my) * 0.12;
        
        let vx = Math.abs(mx - lastMx);
        let vy = Math.abs(my - lastMy);
        lastMx = mx;
        lastMy = my;
        
        let baseSize = 120;
        let stretchX = baseSize + (vx * 18);
        let stretchY = baseSize + (vy * 18);
        
        if (stretchX > 1000) stretchX = 1000;
        if (stretchY > 1000) stretchY = 1000;

        document.documentElement.style.setProperty('--mouse-x', mx + 'px');
        document.documentElement.style.setProperty('--mouse-y', my + 'px');
        document.documentElement.style.setProperty('--mask-width', stretchX + 'px');
        document.documentElement.style.setProperty('--mask-height', stretchY + 'px');
        
        requestAnimationFrame(updateBgGlow);
      }
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        requestAnimationFrame(updateBgGlow);
      }
    </script>
  </body>
</html>
